[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vla-preflight"
version = "0.6.0"
description = "Local VLA workbench from data preflight to supervised robot rollout evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "pyarrow>=16,<24", "pydantic>=2.7,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1.2,<2"]
train = ["torch>=2.6,<3", "Pillow>=10,<13", "av>=12,<19"]
robot = ["pyserial>=3.5,<4", "opencv-python-headless>=4.9,<4.14"]

[project.scripts]
vla-preflight = "vla_preflight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

